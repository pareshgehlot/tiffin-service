<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        padding: 2rem;
      }
      .card {
        max-width: 24rem;
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.4);
        padding: 2rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      p {
        margin-top: 0.5rem;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      code {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.85rem;
        background: rgba(15, 23, 42, 0.06);
        padding: 0.2rem 0.45rem;
        border-radius: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Redirecting you…</h1>
      <p>
        We couldn't find the page you're looking for.<br />
        Hang tight while we send you to
        <code id="redirect-target">/</code>.
      </p>
    </main>
    <script>
      (function () {
        var basePath = '/tiffin-service';
        var path = window.location.pathname;
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var targetElement = document.getElementById('redirect-target');

        if (targetElement) {
          var withoutBase = path.startsWith(basePath) ? path.slice(basePath.length) || '/' : path;
          targetElement.textContent = withoutBase;
        }

        if (!path.startsWith(basePath)) {
          window.location.replace(basePath + '/index.html' + search + hash);
          return;
        }

        var pathWithinBase = path.slice(basePath.length);
        if (pathWithinBase === '' || pathWithinBase === '/') {
          window.location.replace(basePath + '/index.html' + search + hash);
          return;
        }

        var normalized = pathWithinBase.endsWith('/') ? pathWithinBase : pathWithinBase + '/';
        window.location.replace(basePath + normalized + search + hash);
      })();
    </script>
  </body>
</html>
